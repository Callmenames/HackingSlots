<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vault Hacker</title>

<style>

body{
    background:#050505;
    color:#00ff66;
    font-family:monospace;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

#password{
    font-size:32px;
    letter-spacing:4px;
    margin-bottom:20px;
}

#tokens{
    font-size:22px;
    margin:15px;
}

#reelContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:20px;
}

.reel{
    width:90px;
    height:90px;
    border:2px solid #00ff66;
    font-size:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.disabled{
    opacity:0.25;
}

#spinBtn{
    width:120px;
    height:90px;
    font-size:20px;
    cursor:pointer;
}

.upgrades{
    display:flex;
    justify-content:center;
    gap:110px;
    margin-top:5px;
}

.upgradeBtn{
    width:90px;
    height:35px;
}

.barOuter{
    width:400px;
    height:25px;
    border:2px solid #00ff66;
    margin:10px auto;
}

.barInner{
    height:100%;
    width:0%;
    background:#00ff66;
    transition:0.3s;
}

#activeBonuses{
    margin-top:15px;
    color:gold;
}

#bonusChoices{
    margin-top:20px;
}

#bonusChoices button{
    margin:5px;
    padding:10px;
}
    
#message{
    margin-top:20px;
    min-height:30px;
    font-size:20px;
}

</style>
</head>
<body>

<h1>VAULT HACKER</h1>

<div>PASSWORD</div>
<div id="password"></div>

<div>Encryption Key</div>

<div style="margin-top:20px;">
    Bonus Access
    <div class="barOuter">
        <div id="bonusBar" class="barInner"></div>
    </div>
    <div id="bonusText">0 / 10</div>
</div>

<div id="activeBonuses"></div>

<div id="bonusChoices"></div>

<div class="barOuter">
    <div id="barInner" class="barInner"></div>
</div>

<div id="encText">0 / 100</div>

<div id="tokens">Tokens: 100</div>

<div id="reelContainer">

    <div id="reel0" class="reel">❔</div>
    <div id="reel1" class="reel">❔</div>
    <div id="reel2" class="reel">❔</div>

    <div id="reel3" class="reel disabled">⬛</div>
    <div id="reel4" class="reel disabled">⬛</div>

    <button id="spinBtn">SPIN -10</button>

</div>

<div class="upgrades">

    <button id="buy4" class="upgradeBtn">-10</button>
    <button id="buy5" class="upgradeBtn" disabled>-20</button>

</div>

<div id="message"></div>

<script>

const symbols = [
    "💾",
    "🖥️",
    "🔓",
    "📁",
    "🌐",
    "🔑"
];

let tokens = 200;

let encryption = 0;

const password = "PASSWORD";

let revealed = Array(password.length).fill(false);

let activeReels = 3;

let spinning = false;

let bonusProgress = 0;

let bonuses = {
    doubleTokens:0,
    freeSpins:0,
    goldSymbols:0,
    bonusReel:0
};

function updateBonuses(){

    let html = "<b>ACTIVE HACKS</b><br>";

    for(let key in bonuses){

        if(bonuses[key] > 0){

            html += key +
            " (" + bonuses[key] + ")<br>";

        }

    }

    document.getElementById(
        "activeBonuses"
    ).innerHTML = html;

}

function updateBonusMeter(){

    document.getElementById("bonusText")
        .textContent =
        bonusProgress + " / 5";

    document.getElementById("bonusBar")
        .style.width =
        (bonusProgress * 5) + "%";

}

function showBonusChoice(){

    const choices = [

        {
            name:"Double Tokens (10 spins)",
            action:()=>{
                bonuses.doubleTokens = 10;
            }
        },

        {
            name:"5 Free Spins",
            action:()=>{
                bonuses.freeSpins += 5;
            }
        },

        {
            name:"Decrypt Code",
            action:()=>{
                revealLetter();
            }
        },

        {
            name:"+50 Encryption",
            action:()=>{
                encryption += 50;
                updateEncryption();
            }
        },

        {
            name:"Gold Symbol (10 spins)",
            action:()=>{
                bonuses.goldSymbols = 10;
            }
        },

        {
            name:"Free Reel 4 (10 spins)",
            action:()=>{
                bonuses.bonusReel = 10;
            }
        }

    ];

    let a =
        choices[Math.floor(Math.random()*choices.length)];

    let b =
        choices[Math.floor(Math.random()*choices.length)];

    while(a === b){

        b =
        choices[Math.floor(Math.random()*choices.length)];

    }

    const div =
        document.getElementById("bonusChoices");

    div.innerHTML =
        "<h3>ACCESS NODE FOUND</h3>";

    const btn1 =
        document.createElement("button");

    btn1.textContent = a.name;

    btn1.onclick = ()=>{

        a.action();

        div.innerHTML="";

        updateBonuses();

    };

    const btn2 =
        document.createElement("button");

    btn2.textContent = b.name;

    btn2.onclick = ()=>{

        b.action();

        div.innerHTML="";

        updateBonuses();

    };

    div.appendChild(btn1);
    div.appendChild(btn2);

}

function updatePassword(){

    let output = "";

    for(let i=0;i<password.length;i++){

        output += revealed[i]
            ? password[i]
            : "*";

    }

    document.getElementById("password").textContent = output;

}

function revealLetter(){

    const hidden = [];

    for(let i=0;i<revealed.length;i++){

        if(!revealed[i]) hidden.push(i);

    }

    if(hidden.length === 0){

        alert("Vault Hacked!");

        revealed.fill(false);

        updatePassword();

        return;

    }

    const index =
        hidden[Math.floor(Math.random()*hidden.length)];

    revealed[index] = true;

    updatePassword();

}

function updateEncryption(){

    document.getElementById("encText").textContent =
        encryption + " / 100";

    document.getElementById("barInner").style.width =
        encryption + "%";

}

function updateTokens(){

    document.getElementById("tokens").textContent =
        "Tokens: " + tokens;

}

function randomSymbol(){

    let pool = [...symbols];

    if(bonuses.goldSymbols > 0){

        pool.push("⭐");

    }

    return pool[
        Math.floor(Math.random()*pool.length)
    ];

}

document.getElementById("buy4").onclick = ()=>{

    if(spinning) return;

    if(activeReels >= 4) return;

    if(tokens < 10) return;

    if(bonuses.freeSpins > 0){

    bonuses.freeSpins--;

}else{

    tokens -= 10;

}

    activeReels = 4;

    document.getElementById("reel3")
        .classList.remove("disabled");

    document.getElementById("buy5").disabled = false;

    updateTokens();

};

document.getElementById("buy5").onclick = ()=>{

    if(spinning) return;

    if(activeReels >= 5) return;

    if(tokens < 20) return;

    tokens -= 20;

    activeReels = 5;

    document.getElementById("reel4")
        .classList.remove("disabled");

    updateTokens();

};

document.getElementById("spinBtn").onclick = spin;

async function spin(){

    let reelsToUse = activeReels;

    if(
        bonuses.bonusReel > 0 &&
        reelsToUse < 5
    ){
    
        reelsToUse++;
    
    }

    if(spinning) return;

    if(tokens < 10){

        alert("Not enough tokens");

        return;
    }

    spinning = true;

    tokens -= 10;

    updateTokens();

    document.getElementById("message").textContent =
        "";

    let finalResults = [];

    const intervals = [];

    for(let i=0;i<reelsToUse;i++){

        intervals[i] = setInterval(()=>{

            document.getElementById("reel"+i)
                .textContent = randomSymbol();

        },75);

    }

    for(let i=0;i<reelsToUse;i++){

        await new Promise(resolve =>
            setTimeout(resolve,300));

        clearInterval(intervals[i]);

        const result = randomSymbol();

        finalResults.push(result);

        document.getElementById("reel"+i)
            .textContent = result;

    }

    evaluate(finalResults);

    activeReels = 3;

    document.getElementById("reel3")
        .classList.add("disabled");

    document.getElementById("reel4")
        .classList.add("disabled");

    document.getElementById("reel3").textContent = "⬛";
    document.getElementById("reel4").textContent = "⬛";

    document.getElementById("buy5").disabled = true;

    for(let key in bonuses){

    if(bonuses[key] > 0){
    
            bonuses[key]--;
    
        }
    
    }
    
    updateBonuses();

    spinning = false;

}

function evaluate(results){

    const counts = {};

    results.forEach(symbol => {

        counts[symbol] =
            (counts[symbol] || 0) + 1;

    });

    const values = Object.values(counts);

    let reward = 0;
    let handName = "No Win";

    values.sort((a,b)=>b-a);

    if(values[0] === 5){

        reward = 500;
        handName = "Five of a Kind";

    }else if(values[0] === 4){

        reward = 200;
        handName = "Four of a Kind";

    }else if(values[0] === 3 && values[1] === 2){

        reward = 150;
        handName = "Full House";

    }else if(values[0] === 3){

        reward = 100;
        handName = "Three of a Kind";

    }else if(values.filter(v => v === 2).length >= 2){

        reward = 50;
        handName = "Two Pair";

    }else if(values[0] === 2){

        bonusProgress++;
        handName = "Pair";

    }

    if(
    reward > 0 &&
    bonuses.doubleTokens > 0
    ){
    
        reward *= 2;
    
    }

    tokens += reward;

    let encryptionGain = 0;

    const keyCount = counts["🔑"] || 0;

    if(keyCount === 2) encryptionGain = 5;
    if(keyCount === 3) encryptionGain = 15;
    if(keyCount === 4) encryptionGain = 35;
    if(keyCount === 5) encryptionGain = 100;

    const goldCount =
    counts["⭐"] || 0;

    if(goldCount >= 2){
    
        tokens += goldCount * 25;
    
        encryption += goldCount * 5;
    
    }

    encryption += encryptionGain;

    let decrypted = false;

    while(encryption >= 100){

        encryption -= 100;

        revealLetter();

        decrypted = true;

    }

    updateEncryption();
    updateTokens();

    let message = "";

    if(reward > 0){

        message +=
        `${handName} (+${reward} Tokens)`;

    }

    if(encryptionGain > 0){

        message +=
        ` | 🔑 +${encryptionGain} Encryption`;

    }

    if(decrypted){

        message +=
        ` | Password Letter Revealed`;

    }

    if(message === ""){

        message = "No Win";

    }

    document.getElementById("message").textContent =
        message;

    //bonusProgress++;

    if(bonusProgress >= 5){
    
        bonusProgress = 0;
    
        showBonusChoice();
    
    }
    
    updateBonusMeter();
    
}

updateBonusMeter();
updateBonuses();
updatePassword();
updateEncryption();
updateTokens();

</script>

</body>
</html>
