
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vault Hacker</title>

<style>

body{
    background:#050505;
    color:#00ff66;
    font-family:monospace;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

#password{
    font-size:32px;
    letter-spacing:4px;
    margin-bottom:20px;
}

#tokens{
    font-size:22px;
    margin:15px;
}

#reelContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:20px;
}

.reel{
    width:90px;
    height:90px;
    border:2px solid #00ff66;
    font-size:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.disabled{
    opacity:0.25;
}

#spinBtn{
    width:120px;
    height:90px;
    font-size:20px;
    cursor:pointer;
}

.upgrades{
    display:flex;
    justify-content:center;
    gap:110px;
    margin-top:5px;
}

.upgradeBtn{
    width:90px;
    height:35px;
}

.barOuter{
    width:400px;
    height:25px;
    border:2px solid #00ff66;
    margin:10px auto;
}

.barInner{
    height:100%;
    width:0%;
    background:#00ff66;
    transition:0.3s;
}

#message{
    margin-top:20px;
    min-height:30px;
    font-size:20px;
}

</style>
</head>
<body>

<h1>VAULT HACKER</h1>

<div>PASSWORD</div>
<div id="password"></div>

<div>Encryption Key</div>

<div class="barOuter">
    <div id="barInner" class="barInner"></div>
</div>

<div id="encText">0 / 100</div>

<div id="tokens">Tokens: 100</div>

<div id="reelContainer">

    <div id="reel0" class="reel">❔</div>
    <div id="reel1" class="reel">❔</div>
    <div id="reel2" class="reel">❔</div>

    <div id="reel3" class="reel disabled">⬛</div>
    <div id="reel4" class="reel disabled">⬛</div>

    <button id="spinBtn">SPIN -10</button>

</div>

<div class="upgrades">

    <button id="buy4" class="upgradeBtn">-10</button>
    <button id="buy5" class="upgradeBtn" disabled>-20</button>

</div>

<div id="message"></div>

<script>

const symbols = [
    "💾",
    "🖥️",
    "🔓",
    "📁",
    "🌐",
    "🔑"
];

let tokens = 100;

let encryption = 0;

const password = "PASSWORD";

let revealed = Array(password.length).fill(false);

let activeReels = 3;

let spinning = false;

function updatePassword(){

    let output = "";

    for(let i=0;i<password.length;i++){

        output += revealed[i]
            ? password[i]
            : "*";

    }

    document.getElementById("password").textContent = output;

}

function revealLetter(){

    const hidden = [];

    for(let i=0;i<revealed.length;i++){

        if(!revealed[i]) hidden.push(i);

    }

    if(hidden.length === 0){

        alert("Vault Hacked!");

        revealed.fill(false);

        updatePassword();

        return;

    }

    const index =
        hidden[Math.floor(Math.random()*hidden.length)];

    revealed[index] = true;

    updatePassword();

}

function updateEncryption(){

    document.getElementById("encText").textContent =
        encryption + " / 100";

    document.getElementById("barInner").style.width =
        encryption + "%";

}

function updateTokens(){

    document.getElementById("tokens").textContent =
        "Tokens: " + tokens;

}

function randomSymbol(){

    return symbols[
        Math.floor(Math.random()*symbols.length)
    ];

}

document.getElementById("buy4").onclick = ()=>{

    if(spinning) return;

    if(activeReels >= 4) return;

    if(tokens < 10) return;

    tokens -= 10;

    activeReels = 4;

    document.getElementById("reel3")
        .classList.remove("disabled");

    document.getElementById("buy5").disabled = false;

    updateTokens();

};

document.getElementById("buy5").onclick = ()=>{

    if(spinning) return;

    if(activeReels >= 5) return;

    if(tokens < 20) return;

    tokens -= 20;

    activeReels = 5;

    document.getElementById("reel4")
        .classList.remove("disabled");

    updateTokens();

};

document.getElementById("spinBtn").onclick = spin;

async function spin(){

    if(spinning) return;

    if(tokens < 10){

        alert("Not enough tokens");

        return;
    }

    spinning = true;

    tokens -= 10;

    updateTokens();

    document.getElementById("message").textContent =
        "";

    let finalResults = [];

    const intervals = [];

    for(let i=0;i<activeReels;i++){

        intervals[i] = setInterval(()=>{

            document.getElementById("reel"+i)
                .textContent = randomSymbol();

        },75);

    }

    for(let i=0;i<activeReels;i++){

        await new Promise(resolve =>
            setTimeout(resolve,300));

        clearInterval(intervals[i]);

        const result = randomSymbol();

        finalResults.push(result);

        document.getElementById("reel"+i)
            .textContent = result;

    }

    evaluate(finalResults);

    activeReels = 3;

    document.getElementById("reel3")
        .classList.add("disabled");

    document.getElementById("reel4")
        .classList.add("disabled");

    document.getElementById("reel3").textContent = "⬛";
    document.getElementById("reel4").textContent = "⬛";

    document.getElementById("buy5").disabled = true;

    spinning = false;

}

function evaluate(results){

    const counts = {};

    results.forEach(symbol => {

        counts[symbol] =
            (counts[symbol] || 0) + 1;

    });

    const values = Object.values(counts);

    let reward = 0;
    let handName = "No Win";

    values.sort((a,b)=>b-a);

    if(values[0] === 5){

        reward = 500;
        handName = "Five of a Kind";

    }else if(values[0] === 4){

        reward = 150;
        handName = "Four of a Kind";

    }else if(values[0] === 3 && values[1] === 2){

        reward = 100;
        handName = "Full House";

    }else if(values[0] === 3){

        reward = 50;
        handName = "Three of a Kind";

    }else if(values.filter(v => v === 2).length >= 2){

        reward = 30;
        handName = "Two Pair";

    }else if(values[0] === 2){

        reward = 15;
        handName = "Pair";

    }

    tokens += reward;

    let encryptionGain = 0;

    const keyCount = counts["🔑"] || 0;

    if(keyCount === 2) encryptionGain = 5;
    if(keyCount === 3) encryptionGain = 15;
    if(keyCount === 4) encryptionGain = 35;
    if(keyCount === 5) encryptionGain = 100;

    encryption += encryptionGain;

    let decrypted = false;

    while(encryption >= 100){

        encryption -= 100;

        revealLetter();

        decrypted = true;

    }

    updateEncryption();
    updateTokens();

    let message = "";

    if(reward > 0){

        message +=
        `${handName} (+${reward} Tokens)`;

    }

    if(encryptionGain > 0){

        message +=
        ` | 🔑 +${encryptionGain} Encryption`;

    }

    if(decrypted){

        message +=
        ` | Password Letter Revealed`;

    }

    if(message === ""){

        message = "No Win";

    }

    document.getElementById("message").textContent =
        message;

}

updatePassword();
updateEncryption();
updateTokens();

</script>

</body>
</html>
