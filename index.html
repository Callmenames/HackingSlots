<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vault Hacker</title>

<style>
body{
    background:#111;
    color:#0f0;
    font-family:monospace;
    text-align:center;
}

h1{
    color:#00ff88;
}

#reels{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px;
}

.reel{
    width:100px;
    height:100px;
    border:2px solid #0f0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:#000;
}

button{
    margin:5px;
    padding:10px;
    font-size:16px;
}

.panel{
    margin:15px;
}

#bonusChoices button{
    display:block;
    margin:10px auto;
}
</style>
</head>
<body>

<h1>VAULT HACKER</h1>

<div class="panel">
    Tokens: <span id="tokens">100</span>
</div>

<div class="panel">
    Password:
    <div id="password"></div>
</div>

<div class="panel">
    Encryption Key:
    <span id="keyProgress">0</span>/100
</div>

<div id="reels"></div>

<div>
    <button onclick="spin(3)">Spin 3 Reels (10)</button>
    <button onclick="spin(4)">Spin 4 Reels (20)</button>
    <button onclick="spin(5)">Spin 5 Reels (40)</button>
</div>

<div class="panel">
    <h3>Result</h3>
    <div id="result"></div>
</div>

<div class="panel">
    <h3>Collection</h3>
    <div id="collection"></div>
</div>

<div id="bonusChoices"></div>

<script>

let tokens = 100;

let spins = 0;

let keyPoints = 0;

let collection = [];

let bonusState = {
    doubleTokens:0,
    wilds:0,
    gold:0,
    freeSpins:0
};

const baseSymbols = [
    "KEY",
    "TOKEN",
    "DECRYPT",
    "FIREWALL",
    "EXPLOIT",
    "DATA"
];

let password = generatePassword();
let revealed = [];

function generatePassword(){
    const words = [
        "ACCESS",
        "OVERRIDE",
        "BREACH",
        "PROTOCOL",
        "MAINFRAME",
        "DATABASE"
    ];

    let word = words[Math.floor(Math.random()*words.length)];

    revealed = Array(word.length).fill(false);

    return word;
}

function updateUI(){

    document.getElementById("tokens").textContent = tokens;

    document.getElementById("keyProgress").textContent = keyPoints;

    let display = "";

    for(let i=0;i<password.length;i++){
        display += revealed[i] ? password[i] : "*";
    }

    document.getElementById("password").textContent = display;

    document.getElementById("collection").textContent =
        collection.join(", ");
}

function revealLetter(){

    let hidden = [];

    for(let i=0;i<revealed.length;i++){
        if(!revealed[i]) hidden.push(i);
    }

    if(hidden.length===0) return;

    let chosen =
        hidden[Math.floor(Math.random()*hidden.length)];

    revealed[chosen]=true;

    checkVault();
}

function checkVault(){

    if(revealed.every(v=>v)){

        collection.push(password);

        alert("Vault Opened! Collected: " + password);

        password = generatePassword();

        updateUI();
    }
}

function getSymbols(){

    let symbols = [...baseSymbols];

    if(bonusState.wilds>0){
        symbols.push("WILD");
    }

    if(bonusState.gold>0){
        symbols.push("GOLD");
    }

    return symbols;
}

function spin(reels){

    let cost =
        reels===3 ? 10 :
        reels===4 ? 20 :
        40;

    if(bonusState.freeSpins>0){

        bonusState.freeSpins--;

    }else{

        if(tokens < cost){
            alert("Not enough tokens");
            return;
        }

        tokens -= cost;
    }

    spins++;

    let symbols = getSymbols();

    let result = [];

    document.getElementById("reels").innerHTML="";

    for(let i=0;i<reels;i++){

        let symbol =
            symbols[Math.floor(Math.random()*symbols.length)];

        result.push(symbol);

        let div = document.createElement("div");
        div.className="reel";
        div.textContent=symbol;

        document.getElementById("reels").appendChild(div);
    }

    evaluate(result);

    decrementBonuses();

    if(spins % 10 === 0){
        showBonusChoice();
    }

    updateUI();
}

function evaluate(result){

    let counts = {};

    result.forEach(r=>{
        counts[r]=(counts[r]||0)+1;
    });

    let message = "";

    for(let symbol in counts){

        if(counts[symbol] >= 3){

            switch(symbol){

                case "TOKEN":

                    let reward = 25;

                    if(bonusState.doubleTokens>0)
                        reward*=2;

                    tokens += reward;

                    message +=
                    `Token Match +${reward}<br>`;
                    break;

                case "KEY":

                    keyPoints += 25;

                    message +=
                    `Encryption +25<br>`;

                    break;

                case "DECRYPT":

                    revealLetter();

                    message +=
                    `Letter Decrypted<br>`;
                    break;

                case "GOLD":

                    tokens += 50;
                    keyPoints += 25;

                    message +=
                    `Gold Match!<br>`;
                    break;

                case "WILD":

                    revealLetter();
                    tokens += 20;

                    message +=
                    `Wild Bonus!<br>`;
                    break;
            }
        }
    }

    while(keyPoints >= 100){

        keyPoints -= 100;

        revealLetter();

        message +=
        `Encryption Key Triggered!<br>`;
    }

    document.getElementById("result").innerHTML = message;
}

function decrementBonuses(){

    for(let key in bonusState){

        if(bonusState[key] > 0){
            bonusState[key]--;
        }
    }
}

function showBonusChoice(){

    const choices = [

        {
            name:"Double Tokens (5 spins)",
            action:()=>{
                bonusState.doubleTokens = 5;
            }
        },

        {
            name:"Wild Symbols (5 spins)",
            action:()=>{
                bonusState.wilds = 5;
            }
        },

        {
            name:"Gold Symbols (5 spins)",
            action:()=>{
                bonusState.gold = 5;
            }
        },

        {
            name:"Decrypt Letter",
            action:()=>{
                revealLetter();
            }
        },

        {
            name:"3 Free Spins",
            action:()=>{
                bonusState.freeSpins += 3;
            }
        },

        {
            name:"+50 Encryption",
            action:()=>{
                keyPoints += 50;
            }
        },

        {
            name:"+50 Tokens",
            action:()=>{
                tokens += 50;
            }
        }
    ];

    let a =
        choices[Math.floor(Math.random()*choices.length)];

    let b =
        choices[Math.floor(Math.random()*choices.length)];

    while(a===b){
        b =
        choices[Math.floor(Math.random()*choices.length)];
    }

    let container =
        document.getElementById("bonusChoices");

    container.innerHTML =
        "<h3>Choose Bonus</h3>";

    let btn1 =
        document.createElement("button");

    btn1.textContent = a.name;

    btn1.onclick = ()=>{
        a.action();
        container.innerHTML="";
        updateUI();
    };

    let btn2 =
        document.createElement("button");

    btn2.textContent = b.name;

    btn2.onclick = ()=>{
        b.action();
        container.innerHTML="";
        updateUI();
    };

    container.appendChild(btn1);
    container.appendChild(btn2);
}

updateUI();

</script>

</body>
</html>
